name: AtlasOps AgentCore CD

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy AtlasOps to AgentCore Runtime"
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write


jobs:

  deploy-agentcore:
    name: Deploy to AgentCore
    runs-on: ubuntu-latest

    # No hace absolutamente nada salvo que manualmente
    # marques deploy=true.
    if: ${{ inputs.deploy == true }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install AgentCore CLI
        run: |
          npm install -g @aws/agentcore
          agentcore --version

