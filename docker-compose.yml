services:

  postgres:
    image: pgvector/pgvector:pg16

    environment:
      POSTGRES_DB: atlasops
      POSTGRES_USER: atlasops
      POSTGRES_PASSWORD: atlasops

    ports:
      - "5433:5432"

    volumes:
      - pgdata:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U atlasops -d atlasops"
        ]
      interval: 5s
      timeout: 5s
      retries: 10


  atlasops:
    build:
      context: .
      dockerfile: Dockerfile

    env_file:
      - .env

    environment:
      DATABASE_URL: postgresql+psycopg://atlasops:atlasops@postgres:5432/atlasops

    depends_on:
      postgres:
        condition: service_healthy

    stdin_open: true
    tty: true


volumes:
  pgdata: